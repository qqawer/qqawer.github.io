<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Agent 的分层护栏</title><desc id="desc">输入经过检查后进入 Agent，动作按风险分流，高风险动作需要人工确认，最后进行结果校验。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1e3a5f"/></marker></defs><rect width="1440" height="760" fill="#fff"/>
<text x="70" y="72" font-family="Arial,'PingFang SC',sans-serif" font-size="34" font-weight="700" fill="#1e40af">可靠性不是一道墙，而是多层减速带</text><text x="70" y="110" font-family="Arial,'PingFang SC',sans-serif" font-size="19" fill="#64748b">每一层只处理一种风险，高风险动作把控制权交还给人</text>
<circle cx="130" cy="330" r="58" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/><text x="130" y="338" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#374151">用户输入</text><path d="M190 330H280" stroke="#1e3a5f" stroke-width="3" marker-end="url(#a)"/>
<rect x="290" y="270" width="210" height="120" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="395" y="320" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="23" fill="#374151">输入护栏</text><text x="395" y="354" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#64748b">注入 · 隐私 · 范围</text><path d="M505 330H600" stroke="#1e3a5f" stroke-width="3" marker-end="url(#a)"/>
<rect x="610" y="245" width="220" height="170" rx="30" fill="#ddd6fe" stroke="#6d28d9" stroke-width="4"/><text x="720" y="314" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#6d28d9">AGENT</text><text x="720" y="352" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#64748b">观察 · 决策 · 行动</text><path d="M835 330H915" stroke="#6d28d9" stroke-width="3" marker-end="url(#a)"/>
<polygon points="1010,245 1110,330 1010,415 910,330" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="1010" y="323" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#374151">动作是否</text><text x="1010" y="351" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#374151">高风险？</text>
<path d="M1010 418V535H1170" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#a)"/><text x="1030" y="492" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#dc2626">是</text><rect x="1180" y="485" width="190" height="100" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="1275" y="545" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="23" fill="#374151">人工确认</text>
<path d="M1112 330H1190" stroke="#047857" stroke-width="3" marker-end="url(#a)"/><text x="1140" y="312" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#047857">否</text><rect x="1200" y="270" width="170" height="120" rx="18" fill="#a7f3d0" stroke="#047857" stroke-width="3"/><text x="1285" y="320" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="22" fill="#374151">执行动作</text><text x="1285" y="353" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="17" fill="#64748b">权限最小化</text>
<path d="M1285 395V650H720V425" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#a)"/><text x="880" y="675" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#047857">结果校验 · Evals · 失败次数上限 → 再反馈给 Agent</text></svg>

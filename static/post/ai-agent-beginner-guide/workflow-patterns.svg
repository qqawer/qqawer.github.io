<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">从固定工作流到自主 Agent 的选择路径</title><desc id="desc">根据路径能否预先确定、子任务关系以及单 Agent 是否持续失败来选择架构。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1e3a5f"/></marker></defs><rect width="1440" height="820" fill="#fff"/>
  <text x="70" y="72" font-family="Arial,'PingFang SC',sans-serif" font-size="34" font-weight="700" fill="#1e40af">复杂度应该由任务挣来</text><text x="70" y="110" font-family="Arial,'PingFang SC',sans-serif" font-size="19" fill="#64748b">先判断路径是否可预测，再选择编排方式</text>
  <polygon points="720,150 860,235 720,320 580,235" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="720" y="228" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#374151">路径能否</text><text x="720" y="256" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#374151">预先确定？</text>
  <path d="M580 235H320V350" fill="none" stroke="#1e3a5f" stroke-width="3" marker-end="url(#a)"/><text x="430" y="216" font-family="Arial,'PingFang SC',sans-serif" font-size="19" fill="#047857">能</text>
  <path d="M860 235H1120V350" fill="none" stroke="#1e3a5f" stroke-width="3" marker-end="url(#a)"/><text x="990" y="216" font-family="Arial,'PingFang SC',sans-serif" font-size="19" fill="#dc2626">不能</text>
  <text x="320" y="390" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#1e40af">WORKFLOW</text><line x1="130" y1="420" x2="510" y2="420" stroke="#93c5fd" stroke-width="5"/>
  <text x="155" y="475" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#374151">顺序依赖</text><text x="355" y="475" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#64748b">Prompt Chaining</text>
  <text x="155" y="530" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#374151">输入分流</text><text x="355" y="530" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#64748b">Routing</text>
  <text x="155" y="585" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#374151">彼此独立</text><text x="355" y="585" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#64748b">Parallelization</text>
  <text x="155" y="640" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#374151">可反复改进</text><text x="355" y="640" font-family="Arial,'PingFang SC',sans-serif" font-size="21" fill="#64748b">Evaluator–Optimizer</text>
  <rect x="950" y="350" width="340" height="92" rx="18" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/><text x="1120" y="405" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="24" fill="#374151">单 Agent + 清晰工具</text>
  <path d="M1120 446V510" stroke="#6d28d9" stroke-width="3" marker-end="url(#a)"/><polygon points="1120,520 1250,600 1120,680 990,600" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="1120" y="592" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#374151">是否持续选错工具</text><text x="1120" y="620" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#374151">或指令失控？</text>
  <path d="M990 600H815" stroke="#1e3a5f" stroke-width="3" marker-end="url(#a)"/><text x="880" y="582" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#047857">否：保持简单</text>
  <path d="M1120 682V748" stroke="#1e3a5f" stroke-width="3" marker-end="url(#a)"/><text x="1140" y="724" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#dc2626">是：再拆多 Agent</text>
</svg>
